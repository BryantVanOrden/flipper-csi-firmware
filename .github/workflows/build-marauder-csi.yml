name: Build Marauder + CSI

# Builds ESP32 Marauder with our CSI Sense + OTA integration and publishes
# marauder-csi.bin, which the Android app can flash OTA.
#
# How it works:
#   1. Checks out THIS repo (for the CSI/BLE/OTA module sources).
#   2. Checks out your ESP32 Marauder FORK (which contains the small menu / scan /
#      loop edits from firmware/marauder-integration/README.md committed once).
#   3. Copies the CSI modules from this repo into the Marauder source tree so they
#      always track our latest code.
#   4. Builds with PlatformIO and publishes the .bin.
#
# Set the two inputs (or hardcode the defaults) to point at your Marauder fork.

on:
  workflow_dispatch:
    inputs:
      marauder_repo:
        description: 'Your ESP32 Marauder fork (owner/repo) with the CSI integration committed'
        required: true
        default: 'BryantVanOrden/ESP32Marauder'
      marauder_ref:
        description: 'Branch/tag/commit of the fork to build'
        required: true
        default: 'csi-sense'
      pio_env:
        description: 'PlatformIO environment name in the Marauder platformio.ini'
        required: true
        default: 'marauder_flipper'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (CSI modules)
        uses: actions/checkout@v4
        with:
          path: csi-src

      - name: Checkout Marauder fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.marauder_repo }}
          ref: ${{ github.event.inputs.marauder_ref }}
          path: marauder

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Sync CSI modules into Marauder source
        run: |
          set -e
          SRC=csi-src/firmware/src
          DST=marauder/esp32_marauder
          test -d "$DST" || { echo "::error::$DST not found — check the Marauder source layout"; exit 1; }
          cp "$SRC/csi_sense.h"   "$DST/csi_sense.h"
          cp "$SRC/csi_sense.cpp" "$DST/csi_sense.cpp"
          cp "$SRC/ble_link.h"    "$DST/csi_ble_link.h"
          cp "$SRC/ble_link.cpp"  "$DST/csi_ble_link.cpp"
          cp "$SRC/ota.h"         "$DST/csi_ota.h"
          cp "$SRC/ota.cpp"       "$DST/csi_ota.cpp"
          cp "$SRC/config.h"      "$DST/csi_config.h"
          # fix the cross-includes to the renamed headers
          sed -i 's/#include "config.h"/#include "csi_config.h"/' "$DST/csi_sense.cpp" "$DST/csi_ble_link.cpp" "$DST/csi_ota.cpp"
          sed -i 's/#include "ble_link.h"/#include "csi_ble_link.h"/' "$DST/csi_ble_link.cpp"
          sed -i 's/#include "ota.h"/#include "csi_ota.h"/' "$DST/csi_ota.cpp"
          echo "CSI modules synced into $DST"

      - name: Build Marauder
        run: pio run -d marauder -e ${{ github.event.inputs.pio_env }}

      - name: Stage artifact
        run: cp marauder/.pio/build/${{ github.event.inputs.pio_env }}/firmware.bin marauder-csi.bin

      - uses: actions/upload-artifact@v4
        with:
          name: marauder-csi
          path: marauder-csi.bin

      # Publishing to a release lets the app pull it. Create/point a release tag
      # in this repo (or change the target) so both .bin assets live together.
      - name: Publish to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: marauder-csi.bin
