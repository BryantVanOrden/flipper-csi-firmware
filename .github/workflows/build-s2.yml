name: Build ESP32-S2 firmware

# Compiles s2-firmware/ (official Flipper WiFi Dev Board, ESP32-S2, UART transport).

on:
  workflow_dispatch:
  push:
    tags: ['s2-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        run: pio run -d s2-firmware
      - name: Install esptool
        run: pip install "esptool==4.8.1"
      - name: Stage + merge a single flashable image
        run: |
          BD=s2-firmware/.pio/build/flipper_wifi_devboard_s2
          cp "$BD/firmware.bin" flipper-csi-s2.bin
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          echo "boot_app0: $BOOT_APP0"
          # Single image flashable at 0x0 (esptool / web flasher): write_flash 0x0 flipper-csi-s2-merged.bin
          python -m esptool --chip esp32s2 merge_bin -o flipper-csi-s2-merged.bin \
            --flash_mode dio --flash_size 4MB \
            0x1000  "$BD/bootloader.bin" \
            0x8000  "$BD/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BD/firmware.bin"
          # Bundle for the Flipper ESP Flasher app (drop into /ext/apps_data/esp_flasher/)
          mkdir -p esp_flasher
          cp "$BD/bootloader.bin" esp_flasher/bootloader.bin
          cp "$BD/partitions.bin" esp_flasher/partition-table.bin
          cp "$BOOT_APP0"         esp_flasher/boot_app0.bin
          cp "$BD/firmware.bin"   esp_flasher/firmware.bin
          (cd esp_flasher && zip -r ../flipper-csi-s2-espflasher.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: flipper-csi-s2
          path: |
            flipper-csi-s2.bin
            flipper-csi-s2-merged.bin
            flipper-csi-s2-espflasher.zip
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flipper-csi-s2.bin
            flipper-csi-s2-merged.bin
            flipper-csi-s2-espflasher.zip
