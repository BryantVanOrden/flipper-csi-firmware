; Flipper CSI Sense - ESP32-S2 / UART build
; Target: official Flipper Zero WiFi Dev Board (ESP32-S2, no Bluetooth).
; CSI is streamed over UART0 to the Flipper, which bridges it to the phone over
; the Flipper's own Bluetooth (see ../flipper-csi-bridge for the FAP).
;
; Build:   pio run
; Flash:   hold the board's BOOT button, plug USB-C, then `pio run -t upload`
;          (the S2 native USB only enumerates in bootloader mode)

[env:flipper_wifi_devboard_s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Keep Serial on UART0 (GPIO43 TX / 44 RX) wired to the Flipper header,
    ; NOT the S2 native USB-CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0

board_build.partitions = min_spiffs.csv
