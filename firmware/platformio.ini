; Flipper CSI Sense - ESP32-S3 firmware
; Target: ESP32-S3 on the Flipper Zero Multi Board S3 (Marauder MULTIBOARD_S3)
;
; Build:   pio run
; Flash:   pio run -t upload   (put the board in download mode / use the right port)
; Monitor: pio device monitor -b 115200

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ---- Optional on-board TFT status display (off by default) ----
    ; The phone is the real display. Enabling the TFT requires the correct pins
    ; for the Multi Board S3; see firmware/README.md. To enable, uncomment USE_TFT
    ; and add the TFT_eSPI lib + its S3 pin defines.
    ; -DUSE_TFT=1

; If you enable -DUSE_TFT=1, also add to lib_deps:
;   bodmer/TFT_eSPI@^2.5.43
; and define the TFT_eSPI pins for the Multi Board S3 here (verify against your unit):
;   -DUSER_SETUP_LOADED=1 -DST7789_DRIVER=1 ... -DTFT_MOSI=.. -DTFT_SCLK=.. etc.
