; Flipper CSI Sense - ESP32 firmware
; Target: ESP32-WROOM on the Flipper Zero 3-in-1 Multi Board (same chip Marauder runs on)
;
; Build:   pio run
; Flash:   pio run -t upload   (put the Multi Board in flash mode / use the right port)
; Monitor: pio device monitor -b 115200

[env:esp32marauder]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ---- Optional on-board TFT status display (off by default) ----
    ; The phone is the real display. Enabling the TFT requires correct pins for
    ; your board; see firmware/README.md. To enable, uncomment USE_TFT and add
    ; the TFT_eSPI lib + its pin defines.
    ; -DUSE_TFT=1

; If you enable -DUSE_TFT=1, also add to lib_deps:
;   bodmer/TFT_eSPI@^2.5.43
; and define the TFT_eSPI pins here (example for ILI9341 on Marauder Multi Board):
;   -DUSER_SETUP_LOADED=1 -DILI9341_DRIVER=1
;   -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=4 -DTFT_MOSI=23 -DTFT_SCLK=18 -DTFT_MISO=19
;   -DSPI_FREQUENCY=40000000
